<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>作文老师 · Agent 对话</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:#F1F5F9; height:100vh; display:flex; flex-direction:column; }
  header { background:#FFFFFF; border-bottom:1px solid #E2E8F0; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:16px; color:#0F172A; font-weight:700; }
  header .sub { font-size:12px; color:#64748B; margin-top:2px; }
  .btn-new { background:#FFFFFF; border:1px solid #CBD5E1; color:#334155; border-radius:8px; padding:7px 16px; font-size:13px; cursor:pointer; }
  .btn-new:hover { background:#F8FAFC; border-color:#94A3B8; }
  #chat { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:18px; max-width:860px; width:100%; margin:0 auto; }
  .msg { display:flex; gap:10px; }
  .msg.user { flex-direction:row-reverse; }
  .avatar { width:36px; height:36px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; }
  .msg.assistant .avatar { background:#EFF6FF; color:#1D4ED8; border:1px solid #BFDBFE; }
  .msg.user .avatar { background:#FEF3C7; color:#92400E; border:1px solid #FDE68A; }
  .bubble { max-width:72%; padding:12px 16px; border-radius:12px; font-size:14.5px; line-height:1.75; color:#1E293B; white-space:pre-wrap; word-break:break-word; }
  .msg.assistant .bubble { background:#FFFFFF; border:1px solid #E2E8F0; border-top-left-radius:4px; }
  .msg.user .bubble { background:#DBEAFE; border:1px solid #BFDBFE; border-top-right-radius:4px; }
  .steps { margin-bottom:8px; display:flex; flex-direction:column; gap:4px; }
  .step { font-size:12px; color:#64748B; background:#F8FAFC; border:1px solid #E2E8F0; border-radius:6px; padding:4px 10px; }
  .step.tool { color:#92400E; background:#FFFBEB; border-color:#FDE68A; }
  .step.tool_result { color:#166534; background:#F0FDF4; border-color:#BBF7D0; max-height:80px; overflow:hidden; }
  footer { background:#FFFFFF; border-top:1px solid #E2E8F0; padding:16px 24px; }
  .inputbar { max-width:860px; margin:0 auto; display:flex; gap:10px; }
  #inp { flex:1; border:1px solid #CBD5E1; border-radius:10px; padding:11px 14px; font-size:14px; font-family:inherit; resize:none; outline:none; }
  #inp:focus { border-color:#3B82F6; }
  #send { background:#2563EB; color:#FFFFFF; border:none; border-radius:10px; padding:0 26px; font-size:14px; font-weight:600; cursor:pointer; }
  #send:disabled { background:#94A3B8; cursor:not-allowed; }
  .welcome { text-align:center; color:#94A3B8; font-size:13px; margin-top:40px; line-height:2; }
  .welcome b { color:#475569; }
</style>
</head>
<body>
<header>
  <div><h1>作文老师 Agent</h1><div class="sub">persona_v2 + 知识库检索 + 联网搜索 · GLM-5.2</div></div>
  <button class="btn-new" onclick="resetChat()">＋ 新对话</button>
</header>
<div id="chat">
  <div class="welcome">对话开始前的小提示：<br>试试问 <b>「用一句话说说你的作文教学方法」</b>（测人格语气）<br>或 <b>「你最近在网上有什么动态」</b>（测联网搜索）<br>或 <b>「今年高考作文会考什么」</b>（测"先验证再作答"纪律）</div>
</div>
<footer>
  <div class="inputbar">
    <textarea id="inp" rows="1" placeholder="向分身提问…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send" onclick="send()">发送</button>
  </div>
</footer>
<script>
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
const sendBtn = document.getElementById('send');

function addMsg(role, text, steps) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  let stepsHtml = '';
  if (steps && steps.length) {
    stepsHtml = '<div class="steps">' + steps.map(s => {
      const cls = s.type === 'tool' ? 'tool' : (s.type === 'tool_result' ? 'tool_result' : '');
      return `<div class="step ${cls}">${escapeHtml(s.text)}</div>`;
    }).join('') + '</div>';
  }
  div.innerHTML = `<div class="avatar">${role==='user'?'我':'师'}</div><div class="bubble">${stepsHtml}${escapeHtml(text||'').replace(/\n/g,'<br>')}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function send() {
  const q = inp.value.trim();
  if (!q) return;
  inp.value = ''; inp.style.height = 'auto';
  addMsg('user', q);
  sendBtn.disabled = true; sendBtn.textContent = '思考中…';
  // 加一个"正在处理"占位
  const wait = document.createElement('div');
  wait.className = 'msg assistant';
  wait.innerHTML = '<div class="avatar">叁</div><div class="bubble" style="color:#94A3B8">正在思考（检索知识库 → 组装 → 可能联网验证）…</div>';
  chat.appendChild(wait); chat.scrollTop = chat.scrollHeight;
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: q}) });
    const d = await r.json();
    wait.remove();
    if (d.error) { addMsg('assistant', '⚠️ 调用出错：' + d.error); }
    else { addMsg('assistant', d.reply, d.steps); }
  } catch(e) {
    wait.remove();
    addMsg('assistant', '⚠️ 网络错误：' + e.message);
  }
  sendBtn.disabled = false; sendBtn.textContent = '发送';
  inp.focus();
}

async function resetChat() {
  await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'reset'}) });
  chat.innerHTML = '<div class="welcome">会话记忆已清空，开始新对话</div>';
}

inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 140) + 'px'; });
</script>
</body>
</html>
