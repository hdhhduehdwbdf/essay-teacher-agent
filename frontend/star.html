<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长期记忆系统 · STAR 复盘</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/vendor/lucide.min.js"></script>
<style>body{font-family:"Segoe UI","Microsoft YaHei",sans-serif}</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div class="max-w-6xl mx-auto p-6">
  <header class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-3">
      <i data-lucide="brain" class="w-8 h-8 text-purple-400"></i>
      <div>
        <h1 class="text-2xl font-bold">长期记忆系统 · 复盘</h1>
        <p class="text-xs text-slate-400">STAR 法则 + 记忆架构图 · 叁月聚粮分身</p>
      </div>
    </div>
    <div class="flex gap-2">
      <a href="/admin" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm"><i data-lucide="layout-dashboard" class="w-4 h-4"></i>管理台</a>
      <a href="/" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm"><i data-lucide="message-circle" class="w-4 h-4"></i>回到对话</a>
    </div>
  </header>

  <div class="grid grid-cols-2 gap-4 mb-10" id="star"></div>

  <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i data-lucide="network" class="w-5 h-5 text-purple-400"></i>记忆系统架构</h2>
  <div class="space-y-3" id="arch"></div>

  <p class="text-xs text-slate-500 mt-8 text-center">一句话总结：分身从"每次都失忆"变成"越用越懂你"——记忆自动沉淀、合并防矛盾、过期防陈旧、按需注入控成本</p>
</div>
<script>
const S = [
  {t:"S · 背景 Situation", i:"alert-triangle", c:"red", items:[
    "会话记忆只存内存：重启失忆，老师每次都要重新自我介绍",
    "模型只看到最近 12 轮：早说过的年级、目标、弱项全部遗忘",
    "每轮全量塞历史：token 浪费大，长对话成本高",
    "知识库 RAG 只懂\"老师是谁\"，不懂\"眼前这个学生是谁\""]},
  {t:"T · 任务 Task", i:"target", c:"amber", items:[
    "跨会话记住用户：身份、年级、目标、弱项、偏好",
    "延续零依赖路线（纯 Python 标准库）",
    "不挤占知识库检索位、不拖慢对话速度",
    "管理台可视化：可看、可删、可清空"]},
  {t:"A · 行动 Action", i:"wrench", c:"sky", items:[
    "四类存储：画像/偏好/事实/摘要 → long_term.jsonl",
    "12 轮触发：满 24 条消息模型抽取，只输出 JSON",
    "会话结束只摘要新消息，不重复存储",
    "显式\"记住：xxx\"直写，不走模型",
    "合并更新：语义重复改原条目，不堆矛盾",
    "过期机制：事实 6 个月未确认自动失效",
    "按需注入：画像全量 + BM25 TOP3 ≤500 字"]},
  {t:"R · 结果 Result", i:"check-circle", c:"emerald", items:[
    "跨会话认识用户：称呼、年级、弱项自然融入回答",
    "成本可控：记忆块 ≤500 字，抽取 12 轮一次",
    "质量保障：合并防矛盾、过期防陈旧",
    "全透明：管理台可视，单条删除 + 一键清空",
    "零依赖：单文件 memory.py ~250 行，双仓库同步"]},
];
const COLOR = {red:"bg-red-500/15 text-red-400", amber:"bg-amber-500/15 text-amber-400", sky:"bg-sky-500/15 text-sky-400", emerald:"bg-emerald-500/15 text-emerald-400"};
document.getElementById('star').innerHTML = S.map(b=>`
  <div class="bg-slate-900 rounded-xl border border-slate-800 p-5">
    <div class="flex items-center gap-2 mb-3">
      <span class="w-9 h-9 rounded-lg ${COLOR[b.c].split(' ')[0]} flex items-center justify-center"><i data-lucide="${b.i}" class="w-5 h-5 ${COLOR[b.c].split(' ')[1]}"></i></span>
      <h2 class="font-bold text-lg">${b.t}</h2>
    </div>
    <ul class="text-sm text-slate-300 space-y-1.5 leading-relaxed">
      ${b.items.map(x=>`<li class="flex gap-2"><i data-lucide="chevron-right" class="w-4 h-4 text-slate-500 shrink-0 mt-0.5"></i>${x}</li>`).join('')}
    </ul>
  </div>`).join('');

const TYPES = [
  {n:"画像 profile", i:"user", c:"text-emerald-400", d:"身份/年级/目标/弱项<br>全量注入 · 上限 20 条"},
  {n:"偏好 preference", i:"sliders", c:"text-sky-400", d:"讲解深度/要不要例子<br>BM25 按需取 · 上限 20"},
  {n:"事实 fact", i:"bookmark", c:"text-amber-400", d:"带时间戳 · 6 个月未确认过期<br>BM25 按需取 · 上限 50"},
  {n:"摘要 summary", i:"scroll-text", c:"text-slate-400", d:"会话压缩 60 字内<br>只存新消息 · 上限 100"},
];
const TRIGGERS = [
  {n:"对话开始", i:"log-in", c:"text-sky-400", d:"闲置>30min → 摘要上场新消息"},
  {n:"用户输入", i:"zap", c:"text-amber-400", d:"命中\"记住/别忘\" → 直写"},
  {n:"回答完成", i:"log-out", c:"text-emerald-400", d:"每满 24 条 → 模型抽取"},
];
const MECHS = [
  {i:"git-merge", d:"合并更新：相似条目改写原条目，不追加矛盾"},
  {i:"search", i2:1, c:"text-purple-400", d:"BM25 小索引：按当前问题取 TOP3 相关记忆"},
  {i:"scissors", c:"text-purple-400", d:"容量淘汰：超上限按最旧+低置信删除"},
];
document.getElementById('arch').innerHTML = `
  <div class="bg-slate-900 rounded-xl border-2 border-slate-700 p-4">
    <p class="text-xs text-slate-400 mb-3 flex items-center gap-1"><i data-lucide="message-circle" class="w-4 h-4"></i>对话触发点（api.chat）</p>
    <div class="grid grid-cols-3 gap-3 text-center text-xs">
      ${TRIGGERS.map(t=>`<div class="bg-slate-950 rounded-lg border border-slate-700 p-3">
        <i data-lucide="${t.i}" class="w-4 h-4 ${t.c} mx-auto mb-1"></i>
        <p class="font-semibold text-slate-200">${t.n}</p>
        <p class="text-[10px] text-slate-500 mt-1">${t.d}</p></div>`).join('')}
    </div>
  </div>
  <div class="flex justify-center"><i data-lucide="arrow-down" class="w-5 h-5 text-slate-500"></i></div>
  <div class="bg-slate-900 rounded-xl border-2 border-purple-500/40 p-4">
    <p class="text-xs text-slate-400 mb-3 flex items-center gap-1"><i data-lucide="brain" class="w-4 h-4 text-purple-400"></i>memory.py（零依赖 · 四类记忆 + 三条机制）</p>
    <div class="grid grid-cols-4 gap-3">
      ${TYPES.map(t=>`<div class="bg-slate-950 rounded-lg border border-slate-700 p-3">
        <p class="text-xs font-semibold ${t.c} mb-1.5 flex items-center gap-1"><i data-lucide="${t.i}" class="w-3.5 h-3.5"></i>${t.n}</p>
        <p class="text-[10px] text-slate-500">${t.d}</p></div>`).join('')}
    </div>
    <div class="mt-3 grid grid-cols-3 gap-3 text-[11px]">
      ${MECHS.map(m=>`<div class="bg-slate-950 rounded-lg border border-slate-800 p-2.5 flex items-center gap-2"><i data-lucide="${m.i}" class="w-4 h-4 text-purple-400 shrink-0"></i>${m.d}</div>`).join('')}
    </div>
  </div>
  <div class="flex justify-center"><i data-lucide="arrow-down" class="w-5 h-5 text-slate-500"></i></div>
  <div class="bg-slate-900 rounded-xl border-2 border-slate-700 p-4">
    <p class="text-xs text-slate-400 mb-3 flex items-center gap-1"><i data-lucide="file-json" class="w-4 h-4"></i>存储与注入</p>
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-slate-950 rounded-lg border border-slate-700 p-3 font-mono text-[10px] text-slate-400 leading-relaxed overflow-x-auto">
        memory/long_term.jsonl<br>
        { "id": "m20261013_…", "type": "profile",<br>
        &nbsp;&nbsp;"content": "用户是高三学生家长…",<br>
        &nbsp;&nbsp;"created_at": "…", "last_seen_at": "…",<br>
        &nbsp;&nbsp;"confidence": 0.9, "expired": false }
      </div>
      <div class="bg-slate-950 rounded-lg border border-slate-700 p-3 text-[11px] text-slate-400 leading-relaxed">
        <p class="text-purple-400 font-semibold mb-1">每轮注入 system prompt：</p>
        画像类全量 +（偏好/事实/摘要）BM25 TOP3<br>
        模型自然融入回答，不逐条复述<br>
        记忆块 ≤500 字，不挤占知识库检索位
      </div>
    </div>
  </div>`;
lucide.createIcons();
</script>
</body>
</html>
